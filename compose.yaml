name: ${COMPOSE_PROJECT_NAME:-laravel-app}

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

x-app-build: &app-build
  context: .
  target: app
  args:
    PHP_VERSION: ${PHP_VERSION:-8.3}
    NODE_VERSION: ${NODE_VERSION:-22}
    INSTALL_LIBREOFFICE: ${INSTALL_LIBREOFFICE:-true}

services:
  app:
    build: *app-build
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
      - ./Modules:/var/www/html/Modules
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging
    mem_limit: ${APP_MEMORY_LIMIT:-1200m}
    cpus: ${APP_CPU_LIMIT:-1.5}
  queue:
    build: *app-build
    env_file: .env
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--queue=${QUEUE_NAMES:-facebook,default}", "--sleep=${QUEUE_SLEEP:-3}", "--tries=${QUEUE_TRIES:-3}", "--timeout=${QUEUE_TIMEOUT:-660}", "--max-time=${QUEUE_MAX_TIME:-3600}"]
    stop_signal: SIGTERM
    stop_grace_period: 15s
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
      - ./Modules:/var/www/html/Modules
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' </proc/1/cmdline | grep -q 'queue:work'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging
    mem_limit: ${QUEUE_MEMORY_LIMIT:-1400m}
    cpus: ${QUEUE_CPU_LIMIT:-1.5}

  scheduler:
    build: *app-build
    env_file: .env
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
      - ./Modules:/var/www/html/Modules
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' </proc/1/cmdline | grep -q 'schedule:work'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-256m}
    cpus: ${SCHEDULER_CPU_LIMIT:-0.25}

  socket:
    build:
      context: .
      dockerfile: docker/socket/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SOCKET_PORT:-6001}:${NODEJS_SERVER_PORT:-6001}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.NODEJS_SERVER_PORT||6001)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    mem_limit: ${SOCKET_MEMORY_LIMIT:-256m}
    cpus: ${SOCKET_CPU_LIMIT:-0.25}
  web:
    build:
      context: .
      target: web
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        NODE_VERSION: ${NODE_VERSION:-22}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      socket:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8081}:8080"
    volumes:
      - app_storage:/var/www/html/storage:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging
    mem_limit: ${WEB_MEMORY_LIMIT:-128m}
    cpus: ${WEB_CPU_LIMIT:-0.25}

  db:
    image: mariadb:${MARIADB_VERSION:-11.8}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MARIADB_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging
    mem_limit: ${DB_MEMORY_LIMIT:-1200m}
    cpus: ${DB_CPU_LIMIT:-1.5}

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    mem_limit: ${REDIS_MEMORY_LIMIT:-384m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}

volumes:
  app_storage:
  mariadb_data:
  redis_data:
