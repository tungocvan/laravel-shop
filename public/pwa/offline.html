<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>INAFO - Ngoại tuyến</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a;display:grid;min-height:100vh;place-items:center;padding:24px;box-sizing:border-box}.card{max-width:520px;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:32px;box-shadow:0 10px 30px rgba(15,23,42,.08);text-align:center}.icon{width:72px;height:72px;margin:auto}.muted{color:#64748b;line-height:1.6}button{border:0;border-radius:12px;background:#0f172a;color:#fff;padding:12px 18px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/pwa/icon.svg" alt="INAFO">
    <h1>Bạn đang ngoại tuyến</h1>
    <p class="muted">INAFO không lưu ngoại tuyến dữ liệu ứng dụng hoặc dữ liệu người dùng. Hãy kết nối Internet để tiếp tục làm việc.</p>
    <button onclick="location.reload()">Thử lại</button>
  </main>
</body>
</html>
