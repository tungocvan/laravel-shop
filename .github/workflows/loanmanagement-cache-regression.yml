name: LoanManagement cache and regression

on:
  push:
    branches:
      - fix/loanmanagement-stable-pwa-routes-20261111
  pull_request:
    paths:
      - 'Modules/ClientPortal/Applications/LoanManagement/**'
      - 'Modules/LoanManagement/**'
      - 'tests/Feature/ClientApps/LoanManagement*Test.php'
      - 'Dockerfile'
      - 'docker/entrypoint.sh'
      - 'docker/php/opcache.ini'
      - '.github/workflows/loanmanagement-cache-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loanmanagement-cache-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Focused route and Docker cache contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, pdo_mysql, sqlite3, xml, zip
          coverage: none
          tools: composer:v2
      - name: Install locked development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Verify PHP and PHPUnit
        run: |
          php -v
          php -r 'foreach (["bcmath", "pdo_sqlite"] as $ext) { if (!extension_loaded($ext)) { fwrite(STDERR, "$ext missing\n"); exit(1); } }'
          test -x vendor/bin/phpunit
      - name: PHP syntax check
        run: php -l tests/Feature/ClientApps/LoanManagementRouteCacheContractTest.php
      - name: Focused tests
        run: vendor/bin/phpunit tests/Feature/ClientApps/LoanManagementRouteCacheContractTest.php

  loanmanagement-regression:
    name: LoanManagement module regression
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, pdo_mysql, sqlite3, xml, zip
          coverage: none
          tools: composer:v2
      - name: Install locked development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Run module regression
        run: vendor/bin/phpunit tests/Feature/ClientApps/LoanManagement*Test.php
