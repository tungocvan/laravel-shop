name: Website sitemap XML regression

on:
  pull_request:
    paths:
      - 'Modules/Website/resources/views/sitemap.blade.php'
      - 'tests/Feature/Website/**'
      - '.github/workflows/website-sitemap-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-sitemap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sitemap-focused:
    name: Sitemap XML focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, pdo_mysql, sqlite3, xml, zip
          coverage: none
          tools: composer:v2
      - name: Install locked development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Verify test prerequisites and syntax
        run: |
          test -x vendor/bin/phpunit
          php -l tests/Feature/Website/SitemapXmlBladeTest.php
      - name: Run focused Sitemap tests
        run: vendor/bin/phpunit tests/Feature/Website/SitemapXmlBladeTest.php

  website-regression:
    name: Website module regression
    needs: sitemap-focused
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, pdo_mysql, sqlite3, xml, zip
          coverage: none
          tools: composer:v2
      - name: Install locked development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Run Website module regression
        run: vendor/bin/phpunit tests/Feature/Website
